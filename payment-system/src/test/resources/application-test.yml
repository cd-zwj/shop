spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;INIT=RUNSCRIPT FROM 'classpath:schema-test.sql'
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  # 禁用外部中间件自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - cn.dev33.satoken.dao.SaTokenDaoRedisJackson
  data:
    elasticsearch:
      repositories:
        enabled: false

# 禁用 Sa-Token Redis 存储，使用内存模式
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# 禁用 Sa-Token Redis Jackson 自动配置
spring.redis.enabled: false

# 禁用 Elasticsearch 索引配置
app:
  search:
    enabled: false
  swagger:
    enabled: true

# 测试用 AI 配置占位
ai:
  base-url: http://localhost:9999
  analyze-endpoint: /analyze

# 测试用 MinIO 配置占位
minio:
  endpoint: http://localhost:9000
  access-key: testkey
  secret-key: testsecret
  bucket: test-bucket
  bucket-name: test-bucket

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.payment: WARN
    cn.dev33.satoken: WARN


# Spring AI 测试占位，避免测试上下文依赖真实外部凭据
spring.ai.mcp.client.enabled: false
spring.ai.dashscope.api-key: test-dashscope-key
spring.ai.dashscope.connect-timeout-ms: 100
spring.ai.dashscope.read-timeout-ms: 1000
