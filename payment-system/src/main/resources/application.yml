server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: payment-system
  
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/payment_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis配置
  data:
    redis:
      host: 39.108.175.183
      port: 6379
      password: # 如果Redis设置了密码，请在此填写
      database: 0
      timeout: 5000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # RabbitMQ配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

  # Elasticsearch配置
  elasticsearch:
    uris: http://8.148.252.193/:9200
    username: 
    password: 

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# 支付配置
payment:
  # 充值订单超时时间（分钟）
  recharge-order-timeout-minutes: 15
  wechat:
    app-id: your-wechat-appid
    mch-id: your-wechat-mch-id
    api-v3-key: your-wechat-api-v3-key
    cert-path: classpath:cert/wechat/apiclient_cert.pem # 商户API证书路径
    key-path: classpath:cert/wechat/apiclient_key.pem   # 商户API私钥路径
    notify-url: http://your-domain.com/api/payment/wechat/notify
    # 商户API证书序列号（从商户平台获取）
    merchant-serial-number: your-merchant-serial-number
    # 私钥内容（可选，如果不使用key-path文件方式）
    private-key:
  alipay:
    app-id: your-alipay-appid
    private-key: your-alipay-private-key
    public-key: your-alipay-public-key
    gateway-url: https://openapi.alipay.com/gateway.do
    notify-url: http://your-domain.com/api/v1/open/payments/callbacks/alipay-page
    return-url: http://your-domain.com/api/v1/open/payments/returns/alipay-page
  ext-provider:
    base-url: https://pay.myzfw.com
    merchant-id:
    merchant-key:
    notify-url: http://your-domain.com/api/v1/open/payments/callbacks/ext-provider
    return-url: http://your-domain.com/pay/return
    default-pay-type: alipay
    default-device: pc
    client-ip: 127.0.0.1

# AI模块配置
langchain4j:
  community:
    redis:
      host: localhost
      port: 6379
  open-ai:
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: sk-bc948e95ccd54c90922f48a42fd0a530
      model-name: text-embedding-v3
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: sk-bc948e95ccd54c90922f48a42fd0a530
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: sk-bc948e95ccd54c90922f48a42fd0a530
      model-name: qwen-plus
      log-requests: true
      log-responses: true

sa-token:
  token-name: Authorization
  timeout: 86400          # token有效期(秒) = 24小时
  active-timeout: -1      # token临时有效期
  is-concurrent: true     # 是否允许同账号并发登录
  is-share: true          # 多账号共享token
  token-style: uuid       # token风格
  is-log: true            # 是否输出日志

# JWT配置
jwt:
  # 随机生成的256位安全密钥（请勿在生产环境中使用此示例密钥）
  secret: 7K9mP2nQ5rT8wX1zA4bC6dE9fH2jK5mN8pR1sU4vW7yZ0aB3cD6eF9gH2iJ5kL8n
  expiration: 86400000 # 24小时

# 文件上传配置
file:
  upload-path: /uploads
  max-size: 10485760 # 10MB

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: payment-system
  path-prefix: uploads/
  url-expiry-days: 7  # 预签名URL有效期（天）

# Netty配置
netty:
  server:
    port: 8888
    boss-threads: 1
    worker-threads: 4

