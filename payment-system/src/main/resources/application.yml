server:
  port: 8080
  servlet:
    context-path: /api

# CORS 配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

spring:
  application:
    name: payment-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 数据源配置（敏感信息由 application-{profile}.yml 或环境变量提供）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/payment_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # RabbitMQ配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

  # Elasticsearch配置
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# 支付配置
payment:
  recharge-order-timeout-minutes: 15
  wechat:
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    cert-path: classpath:cert/wechat/apiclient_cert.pem
    key-path: classpath:cert/wechat/apiclient_key.pem
    notify-url: ${WECHAT_NOTIFY_URL:http://your-domain.com/api/payment/wechat/notify}
    merchant-serial-number: ${WECHAT_MERCHANT_SERIAL:}
    private-key: ${WECHAT_PRIVATE_KEY:}
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: https://openapi.alipay.com/gateway.do
    notify-url: ${ALIPAY_NOTIFY_URL:http://your-domain.com/api/v1/open/payments/callbacks/alipay-page}
    return-url: ${ALIPAY_RETURN_URL:http://your-domain.com/api/v1/open/payments/returns/alipay-page}
  ext-provider:
    base-url: ${EXT_PAY_BASE_URL:https://pay.myzfw.com}
    merchant-id: ${EXT_PAY_MERCHANT_ID:}
    merchant-key: ${EXT_PAY_MERCHANT_KEY:}
    notify-url: ${EXT_PAY_NOTIFY_URL:http://your-domain.com/api/v1/open/payments/callbacks/ext-provider}
    return-url: ${EXT_PAY_RETURN_URL:http://your-domain.com/pay/return}
    default-pay-type: alipay
    default-device: pc
    client-ip: 127.0.0.1

# AI模块配置（API Key 由 profile 或环境变量提供）
langchain4j:
  community:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  open-ai:
    embedding-model:
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_API_KEY:}
      model-name: text-embedding-v3
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_API_KEY:}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    chat-model:
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_API_KEY:}
      model-name: qwen-plus
      log-requests: true
      log-responses: true

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true

# JWT配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# 文件上传配置
file:
  upload-path: /uploads
  max-size: 10485760

app:
  auth:
    email:
      enabled: ${MAIL_ENABLED:false}
      from: ${MAIL_FROM:}
      subject-prefix: ${MAIL_SUBJECT_PREFIX:[SalesSystem]}
      code-ttl-minutes: ${MAIL_CODE_TTL_MINUTES:10}
      send-cooldown-seconds: ${MAIL_SEND_COOLDOWN_SECONDS:60}
      max-daily-send-count: ${MAIL_MAX_DAILY_SEND_COUNT:20}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:payment-system}
  path-prefix: uploads/
  url-expiry-days: 7

# Netty配置
netty:
  server:
    port: 8888
    boss-threads: 1
    worker-threads: 4
