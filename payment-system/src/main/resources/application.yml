server:
  port: 8080
  tomcat:
    max-http-form-post-size: 128KB
    max-swallow-size: 128KB
  servlet:
    context-path: /api

# CORS 配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

spring:
  application:
    name: payment-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 数据源配置（敏感信息由 application-{profile}.yml 或环境变量提供）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/payment_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis配置
  data:
    elasticsearch:
      repositories:
        enabled: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      jedis:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 8
          max-wait: 3000ms

  # RabbitMQ配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

  # Elasticsearch 配置（默认关闭，详见 app.search.enabled；启用时通过 ES_URIS 指定地址）
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  ai:
    mcp:
      client:
        type: async
        request-timeout: 60s
        toolcallback:
          enabled: true
        sse:
          baidu-mcp:
            url: https://mcp.map.baidu.com/sse
            headers:
              ak: ${BAIDU_MAP_AK:}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      connect-timeout-ms: 10000
      read-timeout-ms: 60000
      chat:
        options:
          stream: true
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      type: ${VECTORSTORE_TYPE:none}
      milvus:
        enabled: ${MILVUS_ENABLED:false}
        initialize-schema: ${MILVUS_INITIALIZE_SCHEMA:true}
        database-name: ${MILVUS_DATABASE_NAME:default}
        leaf-collection-name: ${MILVUS_LEAF_COLLECTION_NAME:rag_leaf_vectors}
        summary-collection-name: ${MILVUS_SUMMARY_COLLECTION_NAME:rag_summary_vectors}
        index-type: ${MILVUS_INDEX_TYPE:IVF_FLAT}
        metric-type: ${MILVUS_METRIC_TYPE:COSINE}
        index-parameters: ${MILVUS_INDEX_PARAMETERS:'{"nlist":1024}'}
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          secure: ${MILVUS_SECURE:false}
          username: ${MILVUS_USERNAME:}
          password: ${MILVUS_PASSWORD:}
          token: ${MILVUS_TOKEN:}

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# Flyway 数据库迁移
spring.flyway:
  enabled: ${FLYWAY_ENABLED:true}
  baseline-on-migrate: true
  baseline-version: 0
  locations: classpath:db/migration

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# 支付配置
payment:
  recharge-order-timeout-minutes: 15
  wechat:
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    cert-path: classpath:cert/wechat/apiclient_cert.pem
    key-path: classpath:cert/wechat/apiclient_key.pem
    notify-url: ${WECHAT_NOTIFY_URL:http://your-domain.com/api/payment/wechat/notify}
    merchant-serial-number: ${WECHAT_MERCHANT_SERIAL:}
    private-key: ${WECHAT_PRIVATE_KEY:}
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: https://openapi.alipay.com/gateway.do
    notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/v1/open/payments/callbacks/alipay-page}
    return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/payment/status}
    seller-id: ${ALIPAY_SELLER_ID:}
  ext-provider:
    base-url: ${EXT_PAY_BASE_URL:https://pay.myzfw.com}
    merchant-id: ${EXT_PAY_MERCHANT_ID:}
    merchant-key: ${EXT_PAY_MERCHANT_KEY:}
    notify-url: ${EXT_PAY_NOTIFY_URL:http://your-domain.com/api/v1/open/payments/callbacks/ext-provider}
    return-url: ${EXT_PAY_RETURN_URL:http://your-domain.com/pay/return}
    default-pay-type: alipay
    default-device: pc
    client-ip: 127.0.0.1

# 外部数据分析服务配置（非 LangChain4j；由 DataAnalysisServiceImpl 调用）
ai:
  base-url: ${AI_ANALYSIS_BASE_URL:http://localhost:9999}
  analyze-endpoint: ${AI_ANALYSIS_ENDPOINT:/analyze}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: ${SA_TOKEN_IS_CONCURRENT:true}
  is-share: ${SA_TOKEN_IS_SHARE:false}
  token-style: uuid
  is-log: true

# Actuator 健康检查 + Prometheus 监控
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:${MAIL_ENABLED:false}}
    elasticsearch:
      enabled: ${ELASTICSEARCH_HEALTH_ENABLED:${APP_SEARCH_ENABLED:false}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# JWT配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# 文件上传配置
file:
  upload-path: /uploads
  max-size: 10485760
  upload:
    temp-dir: ./temp/chunks

app:
  swagger:
    enabled: ${APP_SWAGGER_ENABLED:false}
  # 商品搜索能力：默认关闭，使用 MySQL 模糊查询降级；
  # 需要 Elasticsearch 时显式设置 APP_SEARCH_ENABLED=true 并在 docker-compose 中提供 ES 服务。
  search:
    enabled: ${APP_SEARCH_ENABLED:false}
  auth:
    email:
      enabled: ${MAIL_ENABLED:false}
      from: ${MAIL_FROM:}
      subject-prefix: ${MAIL_SUBJECT_PREFIX:[SalesSystem]}
      code-ttl-minutes: ${MAIL_CODE_TTL_MINUTES:10}
      send-cooldown-seconds: ${MAIL_SEND_COOLDOWN_SECONDS:60}
      max-daily-send-count: ${MAIL_MAX_DAILY_SEND_COUNT:20}
    sms:
      enabled: ${SMS_ENABLED:true}
      provider: ${SMS_PROVIDER:mock}
      sign-name: ${SMS_SIGN_NAME:}
      template-code: ${SMS_TEMPLATE_CODE:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:payment-system}
  bucket: ${MINIO_BUCKET:payment-system}
  path-prefix: uploads/
  url-expiry-days: 7

auth:
  password-recovery:
    expose-reset-code: false

mineru:
  api-key: ${MINERU_API_KEY:}
  model-version: vlm

resilience4j:
  circuitbreaker:
    instances:
      dashscope-chat:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 10s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      dashscope-rerank:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  timelimiter:
    instances:
      dashscope-chat:
        timeout-duration: 60s
        cancel-running-future: false
